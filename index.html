<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="ESCOMCHUCHES · Máquina expendedora de dulces. Todos los productos a $5 MXN." />
  <meta name="theme-color" content="#0b3a6f" />
  <title>ESCOMCHUCHES · Máquina expendedora</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <img class="header__bg" src="assets/header.jpg" alt="Mascota ESCOM comiendo dulces" />
      <div class="header__scrim" aria-hidden="true"></div>
      <div class="header__content">
        <h1 class="header__title">ESCOM<span class="chuch">CHUCHES</span></h1>
        <p class="header__subtitle">Escuela Superior de Chuches</p>
      </div>
    </header>

    <main class="main">
      <p class="main__hint">Toca un producto para comprarlo · Todo a <strong>$5 MXN</strong></p>
      <div class="products" id="products" role="list"></div>
    </main>

    <footer class="footer">ESCOMCHUCHES · Dispensador IoT</footer>
  </div>

  <!-- Thank-you overlay -->
  <div class="overlay" id="overlay" hidden>
    <div class="overlay__card" role="dialog" aria-modal="true" aria-labelledby="thanks-title">
      <div class="overlay__emoji" id="overlay-emoji" aria-hidden="true">🍬</div>
      <h2 class="overlay__title" id="thanks-title">¡Gracias por tu compra!</h2>
      <p class="overlay__text">Disfruta tu ESCOMCHUCHE.</p>
      <button class="overlay__btn" id="overlay-close" type="button">Cerrar</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
