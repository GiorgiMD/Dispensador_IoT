<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="LAS CHUCHESCOM · Máquina expendedora de dulces ESCOMCHUCHES. Cada producto cuesta $5 MXN." />
  <title>LAS CHUCHESCOM · Máquina expendedora</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <img
        class="header__logo"
        src="assets/logo.png"
        alt="Mascota ESCOM · LAS CHUCHESCOM"
      />
      <h1 class="header__title">LAS <span>CHUCHESCOM</span></h1>
      <p class="header__tagline">
        Tu máquina expendedora de dulces · Todos los productos a <strong>$5 MXN</strong>
      </p>
    </header>

    <main class="machine" aria-label="Catálogo de productos">
      <div class="machine__glass">
        <div class="products" id="products" role="list"></div>
      </div>
      <div class="machine__tray" aria-hidden="true">
        <span class="machine__tray-icon">🛒</span>
        <span class="machine__tray-text">Selecciona un producto para comprarlo</span>
      </div>
    </main>

    <footer class="footer">
      <p>ESCOMCHUCHES · Dispensador IoT</p>
    </footer>
  </div>

  <!-- Thank-you overlay -->
  <div class="overlay" id="overlay" hidden>
    <div class="overlay__card" role="dialog" aria-modal="true" aria-labelledby="thanks-title">
      <div class="overlay__emoji" id="overlay-emoji" aria-hidden="true">🍬</div>
      <h2 class="overlay__title" id="thanks-title">¡Gracias por tu compra!</h2>
      <p class="overlay__text">Disfruta tu ESCOMCHUCHE.</p>
      <button class="overlay__btn" id="overlay-close" type="button">Cerrar</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
